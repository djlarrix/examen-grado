# Temario canónico de Derecho Civil.
#
# Es independiente de la universidad: cada cedulario (datos/universidades/*)
# enlaza sus cédulas con estos temas, y el progreso del estudiante se lleva por
# tema. Así, quien se cambia de universidad o estudia con el cedulario de otra no
# pierde lo avanzado.
#
# Campos:
#   id           identificador estable. NO cambiarlo: el progreso guardado lo usa.
#   titulo       nombre del tema tal como se dice en clases.
#   articulos    normas de apoyo. Formato "SIGLA art, art-art". Siglas en
#                src/fuentes/normas.mjs. `npm run verificar-articulos` comprueba
#                contra Ley Chile que cada artículo exista y no esté derogado.
#   requiere     temas que conviene dominar antes (aprendizaje por dominio).
#   relacionados temas con los que la comisión suele pedir relacionar, incluso
#                de Procesal. Son el material de las "preguntas de relación".
rama: civil
titulo: Derecho Civil
unidades:
  - id: civil.fuentes
    titulo: Introducción al Derecho Civil
    temas:
      - id: civil.fuentes.derecho_privado
        titulo: Derecho privado, Derecho civil y sus fuentes
