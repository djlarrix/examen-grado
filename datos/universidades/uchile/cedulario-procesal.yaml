# Cedulario oficial de Derecho Procesal — Facultad de Derecho, Universidad de Chile.
# "Cédulas obligatorias", transcrito del PDF escaneado que publica la Facultad:
# https://weblex.derecho.uchile.cl/FTP/comunicaciones/documentos/Sec_estudio/8_Cedulario_Pregrado.pdf
#
# Incluye procesal orgánico, civil y penal: el cedulario de la Chile no los separa
# en ramos distintos.
ramo: procesal
cedulas:
  # I. LAS INSTITUCIONES DEL DERECHO PROCESAL — 1. Introducción y fuentes
  - numero: 1
    seccion: I. Las instituciones del derecho procesal
    subseccion: 1. Introducción y fuentes
    tema: El Derecho procesal y sus instituciones fundamentales. Concepto, contenido y sistema de fuentes
    contenido: |
      A. El conflicto y sus formas de solución civil y penal. Autotutela, heterotutela y autocomposición. Mirada general a las soluciones alternativas del conflicto civil y penal.
      B. Concepto, contenido, finalidad, e instituciones fundamentales del derecho procesal.
      C. Fuentes directas e indirectas.
  - numero: 2
    seccion: I. Las instituciones del derecho procesal
    subseccion: 1. Introducción y fuentes
    tema: La Constitución Política de la República y los tratados internacionales como fuente del derecho procesal
    contenido: |
      A. Los principios y garantías constitucionales de carácter procesal y su contenido esencial en la Constitución Política de la República y en tratados internacionales ratificados por Chile que se encuentren vigentes.
      B. Órganos contemplados con rango Constitucional y misión de ellos.
  - numero: 3
    seccion: I. Las instituciones del derecho procesal
    subseccion: 1. Introducción y fuentes
    tema: La ley procesal y los auto acordados como fuente del derecho procesal. Otras fuentes
    contenido: |
      A. La Ley procesal.
         (i) Concepto y naturaleza
         (ii) Clasificación y objetivos de estas leyes y análisis de los principales textos que las contienen
         (iii) Interpretación e integración
         (iv) Eficacia en el tiempo y en el espacio
      B. Los autoacordados
      C. Otras fuentes: la doctrina y la jurisprudencia
      D. Unidad o diversidad del derecho procesal
