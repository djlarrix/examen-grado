         (i) Los tipos de tutela jurisdiccional
         (ii) La sentencia como acto jurisdiccional y sus características
         (iii) La ejecución
      B. Los equivalentes jurisdiccionales unilaterales y bilaterales, en particular:
         (i) Transacción
         (ii) Avenimiento
         (iii) Conciliación
         (iv) Mediación
