         (i) Los sujetos procesales en materia civil.
             - Partes y terceros y su intervención en el proceso.
             - Capacidad para ser parte, capacidad procesal, ius postulandi y legitimación procesal.
             - Pluralidad de partes o litisconsorcio. Tipos.
             - Substitución y sucesión procesal.
         (ii) Los sujetos procesales e intervinientes en materia penal.
         (iii) El objeto:
             - El objeto del proceso penal. Delimitación.
             - El objeto del proceso civil. Su contenido, elementos, límites e importancia.
