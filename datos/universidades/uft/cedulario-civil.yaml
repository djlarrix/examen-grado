  - numero: 4
    seccion: 1. Parte general
    subseccion: ""
    tema: Efectos de la ley (nociones generales, excluyendo Ley sobre Efecto Retroactivo de las Leyes).
    contenido: ""
  - numero: 5
    seccion: 2. Personas
    subseccion: ""
    tema: "Personas naturales: noción, principio y fin de existencia (excluye muerte presunta)."
    contenido: ""
  - numero: 6
    seccion: 2. Personas
    subseccion: ""
    tema: Personas jurídicas de derecho privado sin fines de lucro.
    contenido: ""
  - numero: 7
    seccion: 2. Personas
    subseccion: ""
    tema: Atributos de la personalidad (excluye nombre, domicilio y personalidad).
    contenido: ""
  - numero: 8
    seccion: 3. Acto jurídico y parte general del derecho de los contratos
    subseccion: ""
    tema: Concepto de acto jurídico.
    contenido: ""
  - numero: 9
    seccion: 3. Acto jurídico y parte general del derecho de los contratos
    subseccion: ""
    tema: Principios de la contratación (excluye excepciones al efecto relativo de los contratos y efecto absoluto).
    contenido: ""
  - numero: 10
    seccion: 3. Acto jurídico y parte general del derecho de los contratos
    subseccion: ""
    tema: Clasificaciones de los actos jurídicos y de los contratos del Código Civil.
    contenido: ""
  - numero: 11
    seccion: 3. Acto jurídico y parte general del derecho de los contratos
    subseccion: ""
    tema: Elementos o cosas del acto jurídico.
    contenido: ""
  - numero: 12
    seccion: 3. Acto jurídico y parte general del derecho de los contratos
    subseccion: ""
    tema: Requisitos de existencia y de validez del acto jurídico (excluye fraude a la ley).
    contenido: ""
  - numero: 13
    seccion: 3. Acto jurídico y parte general del derecho de los contratos
    subseccion: ""
    tema: "Ineficacia del acto jurídico: solo inexistencia, nulidad e inoponibilidad."
    contenido: ""
  - numero: 14
    seccion: 3. Acto jurídico y parte general del derecho de los contratos
    subseccion: ""
    tema: "Interpretación del contrato: solo los sistemas y las reglas del Código Civil."
    contenido: ""
  - numero: 15
    seccion: 4. Derecho de las obligaciones y de la responsabilidad civil
    subseccion: ""
    tema: Conceptos y elementos de la obligación.
    contenido: ""
  - numero: 16
    seccion: 4. Derecho de las obligaciones y de la responsabilidad civil
    subseccion: ""
    tema: Teoría de las fuentes de las obligaciones (excluye cuasicontratos, enriquecimiento injustificado y declaración unilateral de voluntad).
    contenido: ""
  - numero: 17
    seccion: 4. Derecho de las obligaciones y de la responsabilidad civil
    subseccion: ""
    tema: "Clasificación de las obligaciones: solo de dar, hacer y no hacer; género y especie; puras y simples y sujetas a modalidad (excluye obligaciones modales); y de sujeto único y plural (excluye solidaridad activa y obligaciones indivisibles -salvo las indivisibilidades de pago-)."
    contenido: ""
  - numero: 18
    seccion: 4. Derecho de las obligaciones y de la responsabilidad civil
    subseccion: ""
    tema: "Modos de extinguir las obligaciones: solo resciliación, pago, novación, prescripción y pérdida de la cosa que se debe."
    contenido: ""
  - numero: 19
    seccion: 4. Derecho de las obligaciones y de la responsabilidad civil
    subseccion: ""
    tema: "Efectos de las obligaciones: ejecución forzada de las obligaciones (se incluye derecho de garantía general y referencias generales a la prelación de créditos); derechos auxiliares del acreedor."
    contenido: ""
  - numero: 20
    seccion: 4. Derecho de las obligaciones y de la responsabilidad civil
    subseccion: ""
    tema: "Responsabilidad civil: indemnización de perjuicios en materia contractual (se incluye avaluación de los perjuicios) y responsabilidad civil extracontractual."
    contenido: ""
  - numero: 21
    seccion: 5. Derecho de los bienes
    subseccion: ""
    tema: Conceptos de cosa y bien.
    contenido: ""
  - numero: 22
    seccion: 5. Derecho de los bienes
    subseccion: ""
    tema: "Clasificaciones de los bienes: solo corporales e incorporales -derechos reales y personales- y muebles e inmuebles."
    contenido: ""
  - numero: 23
    seccion: 5. Derecho de los bienes
    subseccion: ""
    tema: Derecho de propiedad, comunidad y acción reivindicatoria.
    contenido: ""
  - numero: 24
    seccion: 5. Derecho de los bienes
    subseccion: ""
    tema: Modos de adquirir el dominio (excluye ocupación y accesión).
    contenido: ""
  - numero: 25
    seccion: 5. Derecho de los bienes
    subseccion: ""
    tema: Mera tenencia.
    contenido: ""
  - numero: 26
    seccion: 5. Derecho de los bienes
    subseccion: ""
    tema: Posesión.
    contenido: ""
  - numero: 27
    seccion: 5. Derecho de los bienes
    subseccion: ""
    tema: Copropiedad (solo concepto, fuentes y extinción).
    contenido: ""
