    contenido: ""
  - numero: 29
    seccion: "6. Derecho de los contratos: parte especial"
    subseccion: ""
    tema: Compraventa (excluye arras, formas de cumplir con la entrega de los predios rústicos, pacto de retroventa y pacto de retracto).
    contenido: ""
  - numero: 30
    seccion: "6. Derecho de los contratos: parte especial"
    subseccion: ""
    tema: Arrendamiento de cosas en el Código Civil (solo conceptos generales); y arrendamiento de inmuebles urbanos (Ley Nº 18.101).
    contenido: ""
  - numero: 31
    seccion: "6. Derecho de los contratos: parte especial"
    subseccion: ""
