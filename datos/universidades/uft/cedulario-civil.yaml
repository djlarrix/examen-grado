    contenido: ""
  - numero: 2
    seccion: 1. Parte general
    subseccion: ""
    tema: "Principios del derecho civil: solo autonomía de la voluntad, buena fe, libre circulación de los bienes y responsabilidad civil."
    contenido: ""
  - numero: 3
    seccion: 1. Parte general
    subseccion: ""
    tema: Interpretación de la ley (solo reglas y elementos).
