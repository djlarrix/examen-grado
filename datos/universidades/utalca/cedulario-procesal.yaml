cedulas:
  - numero: 1
    seccion: 1. DERECHO PROCESAL, FUENTES Y LEY PROCESAL. TRIBUNALES, JURISDICCIÓN Y COMPETENCIA
    subseccion: ""
    tema: Derecho procesal, fuentes y ley procesal. tribunales, jurisdicción y competencia
    contenido: |-
      1.- El Derecho Procesal, en especial sus fuentes
      2.- Tribunales de justicia y sus bases constitucionales y legales
      3.- Atribuciones conservadoras, disciplinarias y económicas
      4.- Jurisdicción: características, límites, momentos de la jurisdicción y su
      relación con la competencia. Instituciones relacionadas
      5.- La competencia: reglas generales, reglas especiales, conflictos y
      contiendas de competencia e institucionales relacionadas.
       Este tema no contempla interrogación de tribunales especiales que no
      integran el P. Judicial. Tampoco la jurisdicción cautelar ni arbitral
