  - numero: 5
    seccion: 5. RECURSOS CIVILES
    subseccion: ""
    tema: Recursos civiles
    contenido: |-
      1.- Los recursos y las resoluciones judiciales
      2.- Los recursos en general: aspectos fundamentales en cuanto a sus
      características y tramitación
      3.- Recurso de apelación: aspectos centrales de su configuración y tramitación.
      Instituciones relacionadas: recurso de hecho, orden de no innovar, entre otras.
      4.- Recursos de casación: aspectos centrales de su configuración como
      recurso extraordinario, tramitación y causales.
       Este tema no contempla lo relativo al recurso de revisión en específico, ni las
      acciones constitucionales.
      Bibliografía
