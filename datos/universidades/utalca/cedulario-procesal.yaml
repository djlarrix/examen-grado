  - numero: 7
    seccion: "7. PROCESO PENAL: SISTEMA RECURSIVO"
    subseccion: ""
    tema: "Proceso penal: sistema recursivo"
    contenido: |-
      1.- Aspectos fundamentales (bases) que identifican el régimen recursivo en
      el CPP
      2.- Derecho al recurso en materia procesal penal
      3.- Recurso de apelación: aspectos centrales de su configuración y tramitación
      4.- Recurso de nulidad: aspectos centrales de su configuración legislativa,
      legitimación, tramitación y aspectos fundamentales de sus causales o
      motivos
       Este tema no contempla la revisión de sentencias condenatorias firmes
