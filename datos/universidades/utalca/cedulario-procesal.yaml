      Blanch.
      - Bordalí, Andrés; Cortez, Gonzalo; Palomo, Diego. 2014. Proceso civil.
      Juicio ordinario de mayor cuantía, 2ª edición revisada, ampliada y actualizada.
      Editorial Thomson Reuters.
      - Orellana Torres, Fernando. 2022. Manual de Derecho Procesal. Tomo
      I. Derecho Procesal Orgánico. 7a edición actualizada. Editorial Librotecnia.
  - numero: 2
    seccion: 2. PROCESO Y PROCEDIMIENTO
    subseccion: ""
    tema: Proceso y procedimiento
    contenido: |-
      1.- Proceso: aspectos fundamentales, incluyendo sistemas procesales.
      2.- Las partes en general, incluyendo terceros (no incluye a los
      tribunales arbitrales).
      3.- La acción, la pretensión y la excepción: aspectos centrales y
      clasificaciones.
      4.- Disposiciones comunes a todo procedimiento
      5.- La cosa juzgada y el desasimiento: efectos de las resoluciones judiciales
      6.- La potestad cautelar: las medidas precautorias, aspectos centrales,
      clasificaciones, presupuestos y tramitación.
       Este tema no contempla costas, cuestiones de competencia,
      implicancias y recusaciones ni privilegio de pobreza. Tampoco incluye
      este punto las medidas prejudiciales.
      Bibliografía
      - Bordalí, Andrés; Cortez, Gonzalo; Palomo, Diego. 2014. Proceso civil.
      Juicio ordinario de mayor cuantía, 2ª edición revisada, ampliada y actualizada.
      Editorial Thomson Reuters.
      - Cortez, Gonzalo; Palomo, Diego. 2018. Proceso civil, normas comunes
      a todo procedimiento e incidentes. 2018. Editorial Thomson Reuters.
      - Orellana, Fernando. 2022. Manual de Derecho P rocesal. Tomo II.
      Procedimientos civiles ordinarios y especiales. 5a edición actualizada. Editorial
      Librotecnia.
      - Stoehrel, Carlos. 2020. De las disposiciones comunes a todo
      procedimiento. 7a edición revisada y actualizada. Editorial Jurídica de Chile.
  - numero: 3
    seccion: 3. JUICIO ORDINARIO Y SUMARIO CIVIL
    subseccion: ""
    tema: Juicio ordinario y sumario civil
    contenido: |-
      1.- El juicio ordinario de mayor cuantía: aspectos fundamentales,
      incluidas las medidas prejudiciales.
      2.- El juicio sumario: aspectos fundamentales.
      3.- La prueba como institución fundamental, incluyendo también la
      comprensión de los contenidos del derecho a la prueba.
      4.- Medios de prueba en particular: Concepto, oportunidad y aspectos
      fundamentales de su naturaleza y procedimiento.
      Bibliografía
      - Bordalí, Andrés; Cortez, Gonzalo; Palomo, Diego. 2014. Proceso civil.
      Juicio ordinario de mayor cuantía, 2ª edición revisada, ampliada y actualizada.
      Editorial Thomson Reuters.
      - Rodríguez, Ignacio. 2017. Procedimiento civil: juicio ordinario de
      mayor cuantía. 8a edición revisada y actualizada. Editorial Jurídica de Chile.
      - Orellana, Fernando. 2022. Manual de Derecho Procesal Tomo II
      Procedimientos civiles ordinarios y especiales. 5ª edición. Editorial Librotecnia.
  - numero: 4
    seccion: 4. JUICIO EJECUTIVO
    subseccion: ""
    tema: Juicio ejecutivo
    contenido: |-
      1.- El Juicio ejecutivo y las instituciones fundamentales.
      2.- Títulos ejecutivos.
      3.- Tramitación: aspectos fundamentales
      4.- Particularidades de la sentencia y la cosa juzgada en el juicio
      ejecutivo
       Este tema no contempla lo relativo a la realización de bienes en el juicio
      ejecutivo. Tampoco el juicio ejecutivo de obligaciones de hacer y no hacer, ni
      las tercerías
      Bibliografía
