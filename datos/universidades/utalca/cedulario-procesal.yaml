      procesales. 3ª edición actualizada. Editorial Jurídica.
      - Orellana, Fernando, 2022. Manual de Derecho Procesal Tomo IV
      Recursos procesales. 5ª edición. Editorial Librotecnia.
  - numero: 6
    seccion: "6. PROCESO PENAL: ASPECTOS CENTRALES"
    subseccion: ""
    tema: "Proceso penal: aspectos centrales"
    contenido: |-
      1.- Procedimiento ordinario: sistemas procesales penales, principios,
      garantías, contenidos y actuaciones centrales de las etapas del
      procedimiento, sujetos procesales, acciones, medidas cautelares
      2.- Principio de oportunidad y manifestaciones
      3.- Salidas alternativas
      4.- Preparación del juicio oral
      5.- La prueba, el juicio y la sentencia: aspectos centrales
       Este tema no contempla los procedimientos especiales
