# Temario de Derecho Civil para el Examen de Licenciatura — Resolución N° 23/2016-F, Facultad de Derecho PUCV. https://www.pucv.cl/uuaa/site/docs/20180712/20180712172457/resoluci__n_23_2016f_fija_temario_derecho_civil.pdf
