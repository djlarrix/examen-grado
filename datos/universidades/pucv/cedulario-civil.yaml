ramo: civil
cedulas:
  - numero: 1
    seccion: I. LOS DERECHOS REALES
    subseccion: ""
    tema: Los derechos reales
    contenido: |-
      INTRODUCCION
      El patrimonio y las clasificaciones de las cosas. Noción del derecho real
      (concepciones clásica y obligacionista). Conceptos básicos de los distintos derechos reales.
      Discusión sobre la taxatividad de la enumeración legal de los derechos reales.
  - numero: 2
    seccion: I. LOS DERECHOS REALES
    subseccion: ""
    tema: El dominio o propiedad
    contenido: |-
      1. Introducción:
      a) Concepto
      b) Delimitación del objeto sobre el que recae la propiedad. Características clásicas del
      derecho de propiedad.
      2. Contenido del derecho de propiedad
      a) La propiedad como poder
      Facultades materiales: Facultades jurídicas. El principio de la libertad de disposición y
      la cláusula de no enajenar.
      b) La propiedad como deber
      Restricciones genéricas y específicas del derecho de propiedad. La teoría del abuso de
      los derechos.
      3. La propiedad indivisa
      Comunidad y copropiedad. Referencia al cuasicontrato de comunidad. Pacto de
      comunidad. Comunidades legales. (Noticia sobre la Copropiedad Inmobiliaria).
      Naturaleza del derecho cuotativo. Comunidades a título universal y a título singular.
      4. La acción reivindicatoria
  - numero: 3
    seccion: I. LOS DERECHOS REALES
    subseccion: ""
    tema: El derecho real de herencia
    contenido: |-
      1. Concepto y características.
      2. Modos de adquirir el derecho real de herencia. Enumeración.
      3. La sucesión por causa de muerte como modo de adquirir el derecho real de herencia.
      4. La posesión de la herencia. Sus clases. La posesión legal de la herencia efectiva de la
      herencia. Las inscripciones hereditarias.
      5. La tradición como modo de adquirir el derecho real de herencia. La cesión de los
      derechos hereditarios.
      6. La prescripción adquisitiva como modo de adquirir el derecho real de herencia.
  - numero: 4
    seccion: I. LOS DERECHOS REALES
    subseccion: ""
    tema: La accion de peticion de herencia
    contenido: |-
      1. Concepto y características.
      2. Objeto, sujeto activo y sujeto pasivo de la acción de petición de herencia.
      3. Efectos.
      4. Prescripción.
  - numero: 5
    seccion: II. LA USUCAPION Y PRIMERAMENTE LA POSESION
    subseccion: ""
    tema: La posesion
    contenido: |-
      Propiedad, posesión, mera tendencia. Elementos de la posesión. Naturaleza jurídica de
      la posesión. Atributos o ventajas reconocidas al poseedor.
  - numero: 6
    seccion: II. LA USUCAPION Y PRIMERAMENTE LA POSESION
    subseccion: ""
    tema: Diversos tipos de posesion
    contenido: |-
      El justo título, (títulos injustos); la buena fe y la tradición como requisitos de la posesión
      regular. La posesión irregular. La posesión violenta y la posesión clandestina.
  - numero: 7
    seccion: II. LA USUCAPION Y PRIMERAMENTE LA POSESION
    subseccion: ""
    tema: Adquisicion, conservacion y perdida de la posesion
    contenido: Bienes muebles. Bienes inmuebles no inscritos. Bienes inmuebles inscritos.
  - numero: 8
    seccion: III. LOS MODOS DE ADQUIRIR
    subseccion: ""
    tema: Los modos de adquirir
    contenido: Los modos de adquirir en general y sus clasificaciones
  - numero: 9
    seccion: III. LOS MODOS DE ADQUIRIR
    subseccion: ""
    tema: La tradicion
    contenido: |-
      1. Requisitos.
      Características de la tradición. Importancia práctica. Presencia de dos partes capaces.
      Consentimiento exento de vicios. Título translaticio de dominio válido. Entrega de la
      cosa.
      2. Estudio particular sobre "la entrega" que caracteriza a la tradición.
      Tradición de derechos reales sobre cosas corporales muebles. Tradición de derechos
      reales sobre cosas corporales inmuebles. Estudio crítico del sistema magistral
      inmobiliario chileno. El Registro Conservador de Bienes Raíces. Objetivos que se
      persiguen con las inscripciones en el Registro de CBR. Tradición del derecho real de
      herencia. Tradición de los derechos personales: estudio de la cesión de créditos. Noticias
      sobre la tradición de derechos litigiosos.
      3. Efectos de la tradición.
  - numero: 10
    seccion: III. LOS MODOS DE ADQUIRIR
    subseccion: ""
    tema: La usucapion o prescripcion adquisitiva
    contenido: |-
      Generalidades. Prescripción adquisitiva y extintiva; reglas comunes. Contraste sobre la
      importancia práctica de la usurpación en Chile y su deterioro en el derecho comparado.
      Requisitos de la usurpación. La accesión de posesiones. La interrupción de la
      prescripción. Prescripción ordinaria y extraordinaria. La suspensión de la prescripción
      ordinaria. La usurpación como modo de adquirir como modo de probar el dominio
      (estudio de títulos). Prescripción contra título inscrito. Usurpación de los derechos
      reales distintos al dominio.
  - numero: 11
    seccion: IV. LOS DERECHOS PERSONALES
    subseccion: ""
    tema: Introduccion
    contenido: |-
      Concepto y paralelo entre derechos personales y derechos reales. Estructura del derecho
      personal u obligación.
  - numero: 12
    seccion: IV. LOS DERECHOS PERSONALES
    subseccion: ""
    tema: Obligaciones de dar, hacer y no hacer
    contenido: ""
  - numero: 13
    seccion: IV. LOS DERECHOS PERSONALES
    subseccion: ""
    tema: Las obligaciones solidarias
    contenido: ""
  - numero: 14
    seccion: V. LAS FUENTES DE LAS OBLIGACIONES
    subseccion: ""
    tema: Introduccion
    contenido: |-
      Presentación histórica de las fuentes de las obligaciones. Clasificación pentapartita
      tradicional y críticas. Surgimiento de otras clasificaciones.
  - numero: 15
    seccion: V. LAS FUENTES DE LAS OBLIGACIONES
    subseccion: ""
    tema: Parte general de los contratos
    contenido: |-
      1. Concepto del contrato. Concepto tradicional. Elementos del contrato.
      2. Clasificaciones y categorías contractuales.
      a) Clasificaciones tradicionales. Contratos unilaterales y bilaterales; gratuitos y onerosos;
      conmutativos y aleatorios; principales y accesorios; consensúales, solemnes y reales;
      nominados o típicos e innominados o atípicos; de ejecución instantánea, de ejecución
      diferida y de tracto sucesivo.
      b) Clasificaciones más recientes. Contratos individuales y colectivos; libremente discutidos
      y de adhesión.
      c) Categorías contractuales. Las condiciones generales y la estandarización contractual. el
      contrato tipo. El contrato ley. El autocontrato. El subcontrato. El contrato preparatorio.
      el contrato por persona a nombrar y por cuenta de quién corresponda.
      3. El principio de la autonomía de la voluntad.
      a) Fundamentación del principio.
      b) Las manifestaciones del principio en la parte general de los contratos. Visión de
      conjunto.
      c) Análisis particular de tales manifestaciones.
      4. Formación del Contrato.
      a) Principio del consensualismo. Su aparición. Excepciones y atenuantes a la noción
      del contrato consensual.
      b) Principio de la libertad contractual. Triple facultad de los contratantes. El contrato
      dirigido en la ley chilena. El contrato forzoso en la ley chilena.
      5. Efectos generales del Contrato.
      a) Principios de la fuerza obligatoria del contrato. El contrato como ley privada. La
      invalidación del contrato por voluntad de las partes o por causas legales. La teoría de la
      imprevisión.
      b) Principio del efecto relativo de los contratos. Concepto. Partes. Terceros absolutos.
      Causahabientes Universales y singulares. Acreedores. Excepciones al principio del
      efecto relativo. La estipulación en favor de un tercero. Oponibilidad del contrato en
      tanto hecho (efecto absoluto o expansivo del contrato). La teoría de la inoponibilidad.
      Motivos de inoponibilidad. La simulación en particular.
      c) Interpretación del contrato. La función interpretativa. Los sistemas subjetivos y
      objetivos de interpretación contractual. La oscuridad del contrato como presupuesto de
      su interpretación. Las reglas de interpretación. Referencia al problema de la casación de
      fondo por errónea interpretación contractual y por violación de la ley de contrato.
      6. El principio de la buena fe. Modificaciones de la buena fe a través de todo el Derecho
      Civil. En particular, la buena fe en el Derecho de los contratos.
      7. Efectos particulares de los contratos bilaterales.
      a) La excepción de contrato no cumplido. Concepto. Requisitos. Procedencia en el juicio
      ejecutivo. Efectos.
      b) La teoría de los riesgos. El problema de los riesgos en general. Diversas soluciones en el
      tiempo y en el espacio. La teoría de los riesgos y la imposibilidad de ejecución.
      Distinción en Chile, entre obligaciones de dar y obligaciones de hacer y no hacer.
      c) La resolución por inejecución. La condición resolutoria expresa, tácita y pacto
      comisario. Características y efectos de la condición resolutoria tácita. Pacto comisorio
      simple y calificado. El pacto comisorio calificado en la compraventa y en otros
      contratos.
      d) Fundamentación común a todos los efectos particulares. Diversas doctrinas.
  - numero: 16
    seccion: V. LAS FUENTES DE LAS OBLIGACIONES
    subseccion: ""
    tema: Contratos en particular
    contenido: |-
      1. La Promesa
      2. La compraventa
      3. El mandato
      4. La hipoteca
  - numero: 17
    seccion: V. LAS FUENTES DE LAS OBLIGACIONES
    subseccion: ""
    tema: Delitos y cuasidelitos civiles. las responsabilidad aquiliana
    contenido: |-
      1. Introducción: Delito y cuasidelito civil; delito y cuasidelito penal. Diferencias entre
      la responsabilidad civil contractual y extracontractual. Opción de responsabilidades.
      Sistemas de responsabilidad aquiliana basados en la falta o en el riesgo. Esferas de
      aplicación de la responsabilidad objetiva en Chile. Variadas formas para atenuar las
      dificultades de prueba anejas al sistema de responsabilidad.
      2. Presunciones de culpabilidad. Por el hecho propio. Por el hecho ajeno. A causa de
      las cosas o animales.
      3. Elementos de la responsabilidad aquiliana. Capacidad. Culpabilidad. Daño o
      perjuicio. Relación de causalidad.
      4. La Reparación. La acción de responsabilidad extracontractual. El daño por
      repercusión o rebote. Extensión de la reparación. Indemnización del daño moral. La
      situación de fortuna del hechor de la víctima. La culpa de la víctima. La variación
      extrínseca del daño a consecuencia de la desvalorización monetaria. Reajustabilidad de
      las indemnizaciones. Cúmulo de indemnizaciones. Eximentes de responsabilidad y
      cláusulas de irresponsabilidad.
  - numero: 18
    seccion: VI. EFECTOS DE LAS OBLIGACIONES
    subseccion: ""
    tema: "Efecto normal : el pago o ejecucion voluntaria"
    contenido: |-
      1. El pago efectivo. Estudio detallado.
      2. La subrogación en general y el pago con subrogación en particular.
      3. El pago por consignación.
      4. La dación en pago.
  - numero: 19
    seccion: VI. EFECTOS DE LAS OBLIGACIONES
    subseccion: ""
    tema: Modos de extinguir diversos el pago
    contenido: |-
      1. El mutuo disenso o resciliación.
      2. La novación.
      3. La prescripción extintiva.
  - numero: 20
    seccion: VI. EFECTOS DE LAS OBLIGACIONES
    subseccion: ""
    tema: "Efectos anormales : la ejecucion forzada"
    contenido: |-
      1. Generalidades. El llamado derecho de prensa general.
      2. Ejecución forzada in natura. Ejecución individual y ejecución universal. Referencia al
      juicio ejecutivo y a la quiebra.
      3. Ejecución forzada en equivalente: Las indemnizaciones de perjuicios en sede
      contractual. Indemnización compensatoria y moratoria. Requisitos de la indemnización:
      reprochabilidad, daño, relación causal y mora. Evaluación de los perjuicios: judicial, legal
      y convencional o cláusula penal. Indemnización por incumplimiento de obligaciones
      dinerarias y novedades aportadas por la ley 18.010. Reajustabilidad de las
      indemnizaciones contractuales a la luz de la jurisprudencia.
  - numero: 21
    seccion: VI. EFECTOS DE LAS OBLIGACIONES
    subseccion: ""
    tema: Derechos auxiliares del acreedor
    contenido: |-
      1. Concepto.
      2. Acción pauliana o revocatoria
  - numero: 22
    seccion: VII. EL ACTO JURIDICO
    subseccion: ""
    tema: Nociones generales y clasificaciones
    contenido: |-
      1. Hechos materiales, hechos jurídicos, actos jurídicos y negocios jurídicos.
      2. Diversas clasificaciones de los actos jurídicos.
  - numero: 23
    seccion: VII. EL ACTO JURIDICO
    subseccion: ""
    tema: Elementos de acto juridico
    contenido: |-
      1. La voluntad. Voluntad interna y voluntad declarada; diversas formas de manifestación
      de la voluntad, formación del consentimiento, vicios de la voluntad: el error, la fuerza y
      el dolo. La lesión.
      2. La capacidad. Capacidad de goce y capacidad de ejercicio. Incapacidad absoluta, relativa
      y especial.
      3. El objeto. Requisitos del objeto. Diversos casos de objeto ilícito en el Código Civil.
      4. La causa. Diversas doctrinas. La causa ilícita. La causa como elemento moralizador del
      acto jurídico.
      5. Las formalidades. Formalidades objetivas o ad solemnitatem; habilitantes; de prueba; de
      publicidad y convencionales.
  - numero: 24
    seccion: VII. EL ACTO JURIDICO
    subseccion: ""
    tema: Sanciones por incumplimiento de las exigencias de los actos
    contenido: |-
      JURIDICOS
      1. Estudio general de la inexistencia, la nulidad y la inoponibilidad. Noción acerca de la
      resolución, la terminación, la revocación y la resciliación.
      2. Estudio pormenorizado de la nulidad relativa y de nulidad absoluta.
  - numero: 25
    seccion: VII. EL ACTO JURIDICO
    subseccion: ""
    tema: Generalidades sobre las modalidades de los actos juridicos
    contenido: ""
  - numero: 26
    seccion: VIII. DERECHO DE FAMILIA
    subseccion: ""
    tema: El matrimonio
    contenido: |-
      1. Definición y características
      2. Requisitos de existencia y validez del matrimonio: Condiciones de existencia.
      Condiciones de validez:
      a) Consentimiento libre y espontáneo
      b) capacidad de los contrayentes
      c) solemnidades
      3. Matrimonios celebrados en el extranjero. Requisitos. Efectos en Chile. Causales de
      Disolución.
      4. Efectos del matrimonio en cuanto a la persona de los cónyuges. Sanción por
      incumplimiento de estos deberes.
      5. La separación de los cónyuges. 5.1 La separación de hecho. Concepto. Requisitos.
      Efectos. 5.2 La separación judicial. Concepto. Requisitos. Efectos. Reanudación de
      la vida en común.
      6. Término del matrimonio: Causas de término del matrimonio. 6.1 La nulidad del
      matrimonio. Causales de nulidad. La acción de nulidad. Efectos de la nulidad.
      Matrimonio putativo. 6.2 El divorcio. Concepto. Clases. Efectos.
      7. Compensación económica por divorcio o nulidad del matrimonio.
  - numero: 27
    seccion: VIII. DERECHO DE FAMILIA
    subseccion: ""
    tema: Regimenes matrimoniales
    contenido: |-
      Generalidades: Concepto. Diversos regímenes matrimoniales: a) régimen de comunidad
      de bienes, b) régimen de separación de bienes, c) régimen sin comunidad, d) régimen
      dotal, e) régimen de participación de los gananciales. Regímenes adoptados por el
      Código Civil. Ventajas e inconvenientes. Modificaciones posteriores.
  - numero: 28
    seccion: VIII. DERECHO DE FAMILIA
    subseccion: ""
    tema: Las capitulaciones matrimoniales
    contenido: |-
      Definición. Restricciones a la libertad de las partes para celebrar capitulaciones
      matrimoniales. Formas de celebrarlas. Efectos. Irrevocabilidad.
  - numero: 29
    seccion: VIII. DERECHO DE FAMILIA
    subseccion: ""
    tema: La sociedad conyugal
    contenido: |-
      1. Concepto. Características. Naturaleza jurídica.
      2. El haber de la Sociedad Conyugal: Haber absoluto. Haber relativo. Haber propio de los
      cónyuges.
      3. El Pasivo de la Sociedad Conyugal. Obligación a la deuda y contribución a la deuda.
      Pasivo Absoluto. Pasivo Relativo.
      4. Las Recompensas. Recompensas adeudadas por la sociedad de los cónyuges.
      Recompensas adeudadas por los cónyuges a la sociedad. Recompensas que los cónyuges
      se adeudan entre sí.
      5. Administración de la sociedad conyugal y de los bienes de la mujer.
      a) Administración Ordinaria.
      Facultad del marido sobre los bienes sociales. Responsabilidad del marido respecto
      de tercero. Responsabilidad de la mujer respecto de tercero.
      b) Administración de los bienes propios de la mujer.
      Extensión de las facultades administrativas del marido. Limitaciones de los bienes
      propios de la mujer.
      c) Administración Extraordinaria.
      Casos en que esta administración corresponde a la mujer. Facultades. Casos en que esta
      administración corresponde a un curador distinto a la mujer. Facultades. Cesación de la
      Administración Extraordinaria.
      6. Disolución de la Sociedad Conyugal.
      a) Causales de disolución.
      b) Efectos que siguen a la disolución.
      c) Inventario y tasación de los bienes. Ocultamiento de bienes.
      d) Formación del cuerpo común de bienes.
      e) Deducción de los bienes propios de los cónyuges.
      f) Balance y liquidación de las recompensas. Acumulación imaginaria.
      g) División de los gananciales.
      h) División del pasivo social. Obligación a las deudas. Contribución a las deudas.
      i) El beneficio de emolumentos.
      j) La renuncia de los gananciales. Derecho opcional de la mujer. Características.
      Oportunidad para hacerlo valer. Efectos de la renuncia.
  - numero: 30
    seccion: VIII. DERECHO DE FAMILIA
    subseccion: ""
    tema: El patrimonio reservado de la mujer casada
    contenido: |-
      1. Concepto. Reseña histórica. Características. Requisitos de existencia.
      2. Activo del patrimonio reservado.
      3. Pasivo del patrimonio reservado.
      4. Administración del patrimonio reservado.
      5. Prueba de su existencia.
      6. Efectos de la disolución de la sociedad conyugal en el patrimonio reservado. Caso en
      que la mujer acepta los gananciales. Casos en que los renuncia.
  - numero: 31
    seccion: VIII. DERECHO DE FAMILIA
    subseccion: ""
    tema: El regimen de separacion de bienes
    contenido: |-
      1. Separación judicial de bienes. Causales que pueden conducir a ella. Efectos que produce.
      Cesación de la separación judicial de bienes.
      2. Separación legal de bienes. Separación legal total. Casos en que se presenta. Separación
      legal parcial. Casos en que se produce.
      3. Separación convencional de bienes. Clases. Separación total pactada en las
      capitulaciones matrimoniales. Separación total pactada durante el matrimonio.
      Separación pactada en capitulaciones matrimoniales.
  - numero: 32
    seccion: VIII. DERECHO DE FAMILIA
    subseccion: ""
    tema: El regimen de participacion en los gananciales
    contenido: ""
  - numero: 33
    seccion: VIII. DERECHO DE FAMILIA
    subseccion: ""
    tema: Los bienes familiares
    contenido: ""
  - numero: 34
    seccion: I. LA FILIACION
    subseccion: ""
    tema: La filiacion
    contenido: |-
      1. Concepto e importancia. Clases. Las diversas clases de filiación en la nueva legislación.
      2. La filiación matrimonial y no matrimonial. Su determinación.
      3. Acciones de filiación. Reclamación e impugnación.
      4. Derechos y Obligaciones entre los padres y los hijos.
      5. La Patria Potestad. Atributos.
      6. Suspensión de la Patria Potestad.
      7. La emancipación.
      8. La adopción.
  - numero: 35
    seccion: IX. DERECHO SUCESORIO
    subseccion: ""
    tema: Sucesion intestada. generalidades. primer orden de sucesion
    contenido: ""
  - numero: 36
    seccion: IX. DERECHO SUCESORIO
    subseccion: ""
    tema: Las asignaciones forzosas
    contenido: |-
      1. Concepto. El problema de la libertad de testar. Enumeración de las asignaturas forzosas.
      Medios directos e indirectos con que son protegidos por la ley.
      2. Los alimentos que se deben por ley a ciertas personas.
      3. Las legítimas. Concepto y características. Enumeración de lo legitimario. Reglas a que
      está sometida la distribución de la mitad legitimaria. Clasificación de las legítimas.
      4. La legítima rigurosa. Concepto y características. Forma como se divide.
      5. La legítima efectiva. Concepto. Casos en que tienen lugar su formación. Síntesis de los
      principios que gobiernan las sucesiones parte testada y parte intestada.
      6. Los acervos. El acervo bruto. El acervo líquido. Las bajas generales de la herencia. El
      acervo líquido. Los acervos imaginarios.
      7. la colación o primer acervo imaginario. Concepto y finalidades que persigue. Requisitos
      para que proceda la colación.
      8. El segundo acervo imaginario. Concepto y finalidades que persigue. Requisitos para que
      proceda su formación. La acción de inoficiosa donación.
      9. Forma como se pagan las legítimas. Cosas que deben y no deben imputarse a las
      legítimas. Situaciones que pueden presentarse en su cargo.
      10. La cuarta de mejoras. Concepto y características. Personas que pueden ser beneficiadas
      con la cuarta de mejoras. Los pactos sobre sucesión futura. Los pactos sobre disposición
      de la cuarta de mejoras.
      Publíquese, regístrese, comuníquese y archívese.
