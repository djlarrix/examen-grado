  - titulo: Cedulario Derecho Procesal
    url: https://www.udla.cl/descargas/derecho/CEDULARIO-DERECHO-PROCESAL.pdf
  - titulo: Calendario de inscripción Examen de Grado Derecho 2026
    url: https://www.udla.cl/descargas/derecho/2026-CALENDARIO-DE-INSCRIPCION-EXAMEN-DE-GRADO-DERECHO.pdf
  - titulo: Tutorial para la preparación de la cédula de Derecho Constitucional
    url: https://www.udla.cl/descargas/derecho/Tutorial-para-la-preparacion-de-la-cedula-de-Derecho-Constitucional.pdf
  - titulo: Instructivo de postulación Examen de Habilitación Específico
    url: https://www.udla.cl/descargas/derecho/Instructivo-de-Postulacion-Examen-de-Habilitacion-Especifico-Escuela-de-Derecho.pdf
cedulario:
