  - numero: 16
    seccion: II. LOS OBJETOS DEL DERECHO
    subseccion: ""
    tema: "Conceptos de cosa y bien. Diversas clasificaciones:"
    contenido: |-
      1. Atendiendo a la naturaleza de las cosas en que consisten:
      1. Bienes corporales e incorporales. Derechos y acciones reales y personales:
      conceptos, elementos, referencia a algunas teorías y paralelo.
      2. Bienes muebles e inmuebles. Clasificación de los derechos y acciones en muebles e
      inmuebles.
  - numero: 17
    seccion: II. LOS OBJETOS DEL DERECHO
    subseccion: ""
    tema: Bienes consumibles y no consumibles.
    contenido: |-
      1. Bienes fungibles y no fungibles. Diferencia entre la fungibilidad y la consumibilidad.
      2. Bienes específicos y genéricos.
      3. Bienes singulares y universales.
      2. Atendiendo a los derechos de que son susceptibles:
      1. Bienes apropiables y no apropiables.
      2. Bienes comerciables y no comerciables.
      3. Bienes particulares y nacionales. Clasificación del dominio público.
      LOS DERECHOS REALES.
  - numero: 18
    seccion: II. LOS OBJETOS DEL DERECHO
    subseccion: ""
    tema: El derecho de propiedad .
    contenido: |-
      1. Concepto, fundamentos, evolución y características.
      2. Facultades o atributos de la propiedad. Facultad y capacidad de disposición.
      3. Contenido pasivo de la propiedad.
      4. Limitaciones a la propiedad.
      5. Diversas clases de propiedad:
      1. En cuanto a su extensión: propiedad plena y mera o nuda propiedad; propiedad absoluta
      y propiedad fiduciaria.
      2. En cuanto a las cosas objeto del derecho: conceptos de propiedad civil, propiedad
      minera, propiedad sobre derechos de aprovechamiento de agua, propiedad intelectual,
      propiedad industrial, etc.
      3. En cuanto a su titular: referencia a la propiedad particular y a la propiedad sobre bienes
      nacional.
      4. Comunidad y copropiedad.
  - numero: 19
    seccion: II. LOS OBJETOS DEL DERECHO
    subseccion: ""
    tema: "Los modos de adquirir la propiedad:"
    contenido: |-
      1. Conceptos de título y modo de adquirir.
      2. Enunciación de los modos de adquirir.
      3. Clasificaciones de los modos de adquirir: originarios y derivativos; a título gratuito y a título
      oneroso; a título singular y a título universal; y entre vivos y por causa de muerte.
      LOS MODOS DE ADQUIRIR LA PROPIEDAD EN PARTICULAR.
  - numero: 20
    seccion: II. LOS OBJETOS DEL DERECHO
    subseccion: ""
    tema: La tradición
    contenido: |-
      1. Concepto, características y requisitos. Entrega y tradición.
      2. Especies de tradición:
      1. Tradición de derechos reales sobre una cosa corporal mueble:
      1. Tradición real.
      2. Tradición ficta.
      2. Tradición de derechos reales sobre una cosa corporal inmueble.
      1. El Conservador de Bienes Raíces: rol de la inscripción conservatoria en Chile; libros
      del Conservador; títulos que deben y pueden inscribirse, y sanción, en general, por
      la falta de inscripción de los títulos que deben inscribirse; Conservador competente
      para practicar una inscripción y documentos idóneos para requerirla; negativa del
      Conservador a practicar una inscripción; y quiénes pueden solicitar una inscripción.
      3. Tradición del derecho de servidumbre.
      4. Tradición del derecho de herencia.
      5. Tradición de los derechos personales.
  - numero: 21
    seccion: II. LOS OBJETOS DEL DERECHO
    subseccion: ""
    tema: La prescripción adquisitiva y la posesión
    contenido: |-
      1. La prescripción en general:
      1. Concepto, evolución y fundamentos de la prescripción.
      2. Conceptos de prescripción adquisitiva y extintiva.
      3. Reglas comunes a la prescripción adquisitiva y extintiva.
      2. Requisitos para ganar por prescripción el dominio. Actos de mera facultad y de mera
      tolerancia.
      3. Prueba de la posesión.
      4. Interrupción natural y civil de la prescripción.
      5. Clases de prescripción: ordinaria y extraordinaria. Suspensión de la prescripción.
  - numero: 22
    seccion: II. LOS OBJETOS DEL DERECHO
    subseccion: ""
    tema: "La posesión:"
    contenido: |-
      a. Concepto y elementos.
      b. Naturaleza jurídica.
      c. Diferencias entre el dominio, la posesión y la mera tenencia. Concepto y características
      de la mera tenencia.
      d. Ventajas de la posesión. Presunciones.
      e. La accesión de posesiones.
      f. La coposesión.
      g. Clases de posesión: regular e irregular; no viciosa y viciosa (posesión útil e inútil).
      h. Adquisición, conservación y pérdida de la posesión de los muebles e inmuebles inscritos.
      Referencia al D.L. Nº 2.695 sobre regularización de la pequeña propiedad raíz y
      constitución del dominio sobre ella.
  - numero: 23
    seccion: II. LOS OBJETOS DEL DERECHO
    subseccion: ""
    tema: Otros modos de adquirir la propiedad y derechos reales limitados.
    contenido: |-
      1. La ley.
      2. Referencia a la sucesión por causa de muerte y al derecho real de herencia (su estudio
      detallado corresponde a la cátedra de Derecho Civil IV).
  - numero: 24
    seccion: II. LOS OBJETOS DEL DERECHO
    subseccion: ""
    tema: Acciones protectoras del dominio y demás derechos reales, y de la posesión.
    contenido: |-
      1. Referencia a las medidas generales de protección del dominio.
      2. Referencia a acciones personales
      3. La acción reivindicatoria:
      1. Concepto.
      2. Cosas que pueden ser reivindicadas. Referencia a la acción de petición de herencia.
      3. Quien puede reivindicar. Acción publiciana.
      4. Contra quién se puede reivindicar.
      5. Medidas precautorias.
      6. Prestaciones mutuas:
      1. Del poseedor vencido al reivindicador.
      2. Del reivindicador al poseedor vencido.
      7. Derecho de retención del poseedor vencido.
      8. Injusto detentador.
  - numero: 25
    seccion: III. LA OBLIGACIÓN EN GENERAL Y SUS FUENTES
    subseccion: ""
    tema: La obligación en general y sus fuentes.
    contenido: |-
      1. Concepto de obligación. Referencia a la relación derecho real y derecho personal. Derecho
      personal y obligación.
      2. Los elementos de la obligación. La cuestión de la patrimonialidad de la obligación.
      3. Importancia y evolución del derecho de las obligaciones.
      4. Teoría general de las fuentes de las obligaciones:
      1. Concepto de fuentes de las obligaciones:
      2. Clasificación tradicional de las fuentes de las obligaciones; críticas. Otras clasificaciones.
      Clasificación del Código Civil.
      3. El contrato: concepto y críticas a la definición del Código Civil.
      4. El cuasicontrato: concepto, críticas y fundamentos. Referencia a los cuasicontratos que
      reglamenta el Código Civil y a los proyectos de este código.
      5. Los hechos ilícitos: conceptos de delito y cuasidelito. Diferencia fundamental con los
      delitos y cuasidelitos penales.
      6. La ley: concepto, fundamento y características de las obligaciones legales.
      7. El enriquecimiento sin causa.
      8. La declaración unilateral de voluntad.
  - numero: 26
    seccion: III. LA OBLIGACIÓN EN GENERAL Y SUS FUENTES
    subseccion: ""
    tema: Clasificación de las obligaciones.
    contenido: |-
      1. Criterios de clasificación de las obligaciones: esquema.
      2. Obligaciones civiles y naturales.
      3. Obligaciones de dar, hacer y no hacer.
      4. Obligaciones de especie o cuerpo cierto y de género. Obligaciones de dinero y de valor. Ley
      Nº18.010 sobre operaciones de crédito de dinero.
      5. Obligaciones de objeto único, de simple objeto múltiple, alternativas y facultativas.
  - numero: 27
    seccion: III. LA OBLIGACIÓN EN GENERAL Y SUS FUENTES
    subseccion: ""
    tema: Obligaciones simplemente conjuntas, solidarias e indivisibles.
    contenido: |-
      Obligaciones puras y simples, y sujetas a condición, a plazo y a modo.
      Otras categorías de obligaciones: de medio y de resultado, propter rem o ambulatorias y,
      causales y abstractas o formales.
  - numero: 28
    seccion: III. LA OBLIGACIÓN EN GENERAL Y SUS FUENTES
    subseccion: ""
    tema: Efectos de las obligaciones.
    contenido: |-
      1. Efectos desde el punto de vista del cumplimiento: cumplimiento voluntario o pago y
      modalidades del pago. Cumplimiento voluntario por equivalencia: dación en pago,
      compensación y confusión.
      2. Efectos desde el punto de vista del incumplimiento en las obligaciones de dar, hacer y no
      hacer:
      1. El cumplimiento forzoso en naturaleza o ejecución forzada:
      1. Derecho de prenda general.
      2. Referencia a la acción ejecutiva y a la Insolvencia.
      3. Prelación de créditos: concepto. Las preferencias: clases y características.
  - numero: 29
    seccion: III. LA OBLIGACIÓN EN GENERAL Y SUS FUENTES
    subseccion: ""
    tema: "La ejecución por equivalencia o indemnización de perjuicios:"
    contenido: |-
      i. Responsabilidad civil contractual: concepto y fundamentos.
      ii. Requisitos de la responsabilidad civil contractual: incumplimiento, imputabilidad
      (hecho del deudor, culpa y dolo), mora (mora del deudor y del acreedor; excepción
      de contrato no cumplido; el derecho de retención) y daño (concepto, clases y
      avaluación).
      iii. Corrección monetaria de la indemnización.
      iv. Circunstancias que alteran o eliminan la responsabilidad del deudor: dolo como
      agravante de responsabilidad, referencia a la ausencia de culpa, caso fortuito y
      fuerza mayor, estado de necesidad, hecho o culpa del acreedor, hecho ajeno, teoría
      de la imprevisión y convenciones modificatorias de la responsabilidad.
  - numero: 30
    seccion: III. LA OBLIGACIÓN EN GENERAL Y SUS FUENTES
    subseccion: ""
    tema: Derechos auxiliares del acreedor. Acción oblicua o subrogatoria y acción revocatoria o pauliana.
    contenido: |-
      TRANSFERENCIA, TRANSMISIÓN Y EXTINCIÓN DE LAS OBLIGACIONES.
      1. La transferencia de las obligaciones. Referencia a la cesión de créditos, a la asunción de
      deudas y a la cesión del contrato.
      2. La transmisión de obligaciones. Deudas hereditarias y testamentarias. Derechos y
      obligaciones intransmisibles.
  - numero: 31
    seccion: III. LA OBLIGACIÓN EN GENERAL Y SUS FUENTES
    subseccion: ""
    tema: Modos de extinguir las obligaciones.
    contenido: |-
      1. Ideas generales.
      2. Modos diferentes del pago: resciliación, remisión, novación, imposibilidad de cumplimiento
      (la pérdida de la cosa que se debe y la teoría de los riesgos) y prescripción extintiva
      (diferencias con la caducidad).
  - numero: 32
