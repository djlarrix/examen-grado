  - numero: 55
    seccion: VII. RESPONSABILIDAD CIVIL EXTRACONTRACTUAL Y CONTRACTUAL
    subseccion: ""
    tema: Concepto, clases y sistemas de responsabilidad
    contenido: |-
      a) Noción y sistemas: responsabilidad objetiva y responsabilidad subjetiva.
      b) Clases de responsabilidad civil: contractual, precontractual y extracontractual;
      determinación de la procedencia de una en subsidio de la otra.
      c) El cúmulo u opción de responsabilidades; sistemas de responsabilidad: objetivo y subjetivo.
      d) Elementos de la responsabilidad
      1.- El acto humano: la voluntad – acción u omisión
      2.-Casos de exclusión de responsabilidad por ausencia de acción.
      3.- El caso fortuito o fuerza mayor.
      4.-El problema de la responsabilidad de las personas jurídicas; la voluntad en los actos
      colectivos.
      5.- La capacidad: regla general; incapacidades.
      6.- La antijuridicidad: antijuridicidad y tipicidad: el ilícito civil típico; la responsabilidad por hecho
      lícito; el problema del abuso del derecho.
      7.- Circunstancias que excluyen la ilicitud: legítima defensa, estado de necesidad, el
      incumplimiento de la promesa matrimonial; la asunción voluntaria de responsabilidad: a) los
      pactos de irresponsabilidad, b) la aceptación de los riesgos.
      8.- El dolo: concepto, teoría unitaria del dolo, prueba, efectos.
      9.- La culpa; concepto, forma de apreciar la culpa, graduación, prueba, presunción de la culpa
      contractual; responsabilidad sin culpa en nuestra legislación; fundamento de responsabilidad
      sin culpa; regímenes legales de la responsabilidad sin culpa en el derecho chileno.
      10.-El daño: noción de daño; requisitos de la resarcibilidad del daño. Clases de daño (daño
      patrimonial y no patrimonial), resarcibilidad del daño moral; avaluación del daño moral:
      tendencias.
      11.-Relación de causalidad entre la acción u omisión culposa o dolosa y el daño.
      12.-Teorías que intentan determinar la naturaleza del nexo causal.
      55. Presunciones de responsabilidad
      • Las presunciones de culpa: fundamentos y clasificación.
      • Presunciones de responsabilidad por hecho propio; presunciones de responsabilidad
      por el hecho ajeno.
      • Presunciones de responsabilidad por el hecho de las cosas.
