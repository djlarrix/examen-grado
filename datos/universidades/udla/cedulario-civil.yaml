  - numero: 39
    seccion: V. DERECHO DE FAMILIA.
    subseccion: ""
    tema: Derecho de familia
    contenido: |-
      1. Concepto, ubicación y características del Derecho de Familia.
      2.Concepto de familia.
      3. Referencia a la protección jurídica de la familia.
      4. Fuentes de las relaciones de familia. El parentesco.
      5. Principios que inspiraron al Código Civil a la época de su dictación y su evolución legislativa.
      Principios que en la actualidad inspiran al Código Civil.
  - numero: 40
    seccion: V. DERECHO DE FAMILIA.
    subseccion: ""
    tema: El matrimonio y acuerdo de unión civil.
    contenido: |-
      1.- Matrimonio:
      1. Concepto y requisitos de existencia y validez.
      2. Celebración y efectos.
      3. Disolución del matrimonio:
      a) Muerte natural y presunta
      b) Sentencia firme de nulidad (revisión comparativa nulidad matrimonial y nulidad
      patrimonial)
      c) Sentencia firme de divorcio
      d) Voluntad del cónyuge de la persona que ha obtenido la rectificación de la Ley N
      °21.120, en aplicación de lo dispuesto en el artículo 19 de este cuerpo legal)
      4. Matrimonio putativo.
      2. Divorcio: conceptos y efectos del divorcio
      3. Separación Judicial.
      4. Concubinato.
      2.- Acuerdo de Unión Civil.
  - numero: 41
    seccion: V. DERECHO DE FAMILIA.
    subseccion: ""
    tema: Régimen patrimonial del matrimonio.
    contenido: |-
      1. Concepto y noción general de los distintos regímenes económicos del matrimonio. El
      régimen chileno.
      2. Capitulaciones matrimoniales.
      3. Sociedad conyugal:
      1. Concepto.
      2. Haber absoluto y relativo. Haber propio de cada cónyuge.
      3. Pasivo: obligación y contribución a las deudas.
      4. Recompensas.
      5. Administración ordinaria y extraordinaria. Patrimonio reservado de la mujer casada y
      otros patrimonios parcialmente separados.
      6. Disolución.
      7. Renuncia a los gananciales.
      8. Liquidación de la sociedad conyugal.
      4. Separación de bienes: judicial, convencional y legal.
      5. Participación en los gananciales.
  - numero: 42
    seccion: V. DERECHO DE FAMILIA.
    subseccion: ""
    tema: Los bienes familiares
    contenido: |-
      1. Concepto y características.
      2. Bienes que pueden declararse familiares.
      3. Declaración de afectación de un bien como familiar:
      4. Efectos de la afectación de un bien como familiar.
      5. Limitaciones a la ejecución de los bienes familiares.
      6. Desafectación de los bienes familiares.
  - numero: 43
