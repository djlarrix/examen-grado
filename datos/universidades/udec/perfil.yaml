  - titulo: Reglamento de Docencia de la Facultad
    url: https://jur.udec.cl/sites/default/files/Reglamento%20Docencia%20Facultad_0.pdf
  - titulo: Información a egresados sobre el Cedulario de Derecho Civil (mayo 2022)
    url: http://juridicasysociales.udec.cl/sites/default/files/Informaci%C3%B3n%20egresados.%20Cedulario%20Derecho%20Civil.pdf
