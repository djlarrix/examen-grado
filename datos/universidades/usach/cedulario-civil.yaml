      iii. Excepciones o declinaciones en el ordenamiento jurídico.
  - numero: 9
    seccion: I. Introducción al Derecho Civil
    subseccion: ""
    tema: Principio de Libertad
    contenido: |-
      i. Conceptualización del principio.
      ii. Tratamiento de la materia en el ordenamiento jurídico e importancia
      de su regulación.
      iii. Excepciones o declinaciones en el ordenamiento jurídico.
      2. Relación Jurídica y Derechos Subjetivos.
  - numero: 10
    seccion: I. Introducción al Derecho Civil
    subseccion: ""
    tema: Relación Jurídica y Derecho subjetivo.
    contenido: |-
      i. Concepto y elementos de la relación jurídica de Derecho Privado.
      1) Sujetos.
      2) Deber jurídico.
      3) Derechos subjetivos.
      ii. Concepto de derecho subjetivo.
      1) Derechos absolutos y relativos.
      2) Derechos privados y públicos.
      3) Adquisición, transferencia y pérdida de los derechos
      subjetivos.
      4) Límite de los derechos subjetivos privados. Teoría de los actos
      propios.
      iii. Clasificación.
  - numero: 11
    seccion: I. Introducción al Derecho Civil
    subseccion: ""
    tema: Teoría del abuso del derecho.
    contenido: |-
      i. Concepto de abuso del derecho.
      ii. Concepto de derecho subjetivo y derecho objetivo.
      iii. Fines económicos y sociales del derecho.
  - numero: 12
    seccion: I. Introducción al Derecho Civil
    subseccion: ""
    tema: Dolo y mala fe.
    contenido: |-
      i. Concepto de dolo.
      1) Regulación de la materia en el Código Civil.
      2) Consecuencias del dolo.
      ii. Concepto de buena y mala fe.
      1) Casos en que no se presume buena fe.
      2) Consecuencias de la mala fe.
  - numero: 13
    seccion: I. Introducción al Derecho Civil
    subseccion: ""
    tema: Protección de la confianza y apariencia y protección de los terceros de buena fe en el Código Civil.
    contenido: |-
      i. La buena fe y su relación con la confianza.
      ii. Efectos de un acto entre las partes y con terceros. Sanción de
      inoponibilidad.
      iii. Manifestación de la confianza y teoría de la apariencia en el Código
      Civil.
      1) Elementos que estructuran la teoría de la apariencia.
      2) Teoría del acto simulado.
      iv. Concepto de error común.
  - numero: 14
    seccion: I. Introducción al Derecho Civil
    subseccion: ""
    tema: Efectos jurídicos del tiempo en el ordenamiento.
    contenido: |-
      i. Concepto de efecto jurídico.
      1) Adquisición.
      2) Modificación.
      3) Extinción.
      ii. Hechos jurídicos. Tiempo como hecho jurídico natural.
  - numero: 15
    seccion: I. Introducción al Derecho Civil
    subseccion: ""
    tema: La relación jurídica y los efectos de la ley en el tiempo.
    contenido: |-
      i. Efectos de la ley en el tiempo.
      1) Principio de la irretroactividad de la ley.
      2) Ley sobre los efectos retroactivos de las leyes.
      ii. Teorías sobre la aplicación retroactiva de la ley.
      1) Teoría de los derechos adquiridos. Concepto de derecho
