      2) Teoría de la situación jurídica.
  - numero: 16
    seccion: I. Introducción al Derecho Civil
    subseccion: ""
    tema: Distinción entre derechos personales y reales.
    contenido: |-
      i. Concepto y naturaleza de derecho real.
      1) Derechos reales consagrados en el Código Civil.
      2) Derechos reales consagrados en otros cuerpos normativos.
      ii. Concepto y naturaleza de derecho personal.
      iii. Diferencias entre ambos: Importancia de la distinción.
      1. Teoría del Acto Jurídico y el Contrato.
  - numero: 17
    seccion: II. Teoría del Acto Jurídico y el Contrato
    subseccion: ""
    tema: Teoría del Acto Jurídico.
    contenido: |-
      i. Concepto.
      ii. Elementos.
      iii. Requisitos de existencia.
      iv. Requisitos de validez.
      v. Efectos.
  - numero: 18
    seccion: II. Teoría del Acto Jurídico y el Contrato
    subseccion: ""
    tema: Principios generales de la contratación.
    contenido: |-
      i. Principio de la autonomía de la voluntad.
      1. Consensualismo. Atenuante y excepciones.
      2. Libertad de contratación o libertad contractual. Limitaciones:
      orden público, buenas costumbres y ley.
      3. Fuerza obligatoria de los contratos. Pacta sunt servanda .
      Frente al legislador, al juez y a las partes
      4. Efecto relativo. Excepción al efecto relativo. Efecto absoluto
      o expansivo.
      ii. Principio de buena fe.
      1. Buena fe subjetiva en relación a los contratos.
      2. Buena fe objetiva.
      iii. Principio de igualdad.
      iv. Principio de responsabilidad contractual.
  - numero: 19
    seccion: II. Teoría del Acto Jurídico y el Contrato
    subseccion: ""
    tema: Elementos del acto jurídico.
    contenido: |-
      i. Elementos de existencia.
      1. Voluntad.
      2. Causa.
      3. Objeto.
      4. Solemnidades.
      ii. Elementos de validez.
      1. Voluntad exenta de vicios.
      2. Causa lícita.
      3. Objeto lícito.
      4. Capacidad.
      5. Solemnidades.
      iii. Diferencias entre los elementos esenciales, naturales y accidentales.
  - numero: 20
    seccion: II. Teoría del Acto Jurídico y el Contrato
    subseccion: ""
    tema: Manifestación de la voluntad.
    contenido: |-
      i. Voluntad como requisito de existencia del acto jurídico.
      ii. Requisitos.
      1. Manifiesta: Expresa. Tácita. Valor del silencio.
      2. Seria.
  - numero: 21
    seccion: II. Teoría del Acto Jurídico y el Contrato
    subseccion: ""
    tema: Formación del consentimiento.
    contenido: |-
      i. Voluntad en los actos jurídicos bilaterales: Concepto de
      consentimiento.
      ii. Elementos de la formación del consentimiento.
      iii. Oferta. Completa.
      iv. Aceptación. Pura y simple. Término oportuno. Mientras oferta se
      encuentre vigente.
      v. Momento en que se forma el consentimiento.
      vi. Lugar donde se forma el consentimiento.
  - numero: 22
    seccion: II. Teoría del Acto Jurídico y el Contrato
    subseccion: ""
    tema: Consensualismo.
    contenido: |-
      i. Relación entre consensualismo y autonomía de la voluntad.
      1. Suficiencia de la sola voluntad para perfeccionar el acto
      jurídico.
      2. Importancia que la voluntad se baste a sí misma.
      ii. Excepciones
      1. Solemnidades de existencia.
      2. Contratos reales.
      iii. Atenuantes.
      1. Solemnidades de validez.
      2. Formalidad habilitante.
      3. Formalidad de publicidad.
      4. Formalidad de prueba.
  - numero: 23
    seccion: II. Teoría del Acto Jurídico y el Contrato
    subseccion: ""
    tema: Vicios del consentimiento.
    contenido: |-
      i. Concepto de vicio del consentimiento.
      1. Manifestación de voluntad no coincide con la voluntad real.
      2. Vicios en la voluntad unilateral.
      ii. Vicios del consentimiento.
      1. Error.
      2. Fuerza.
      3. Dolo.
      iii. Requisito general: vicio determinante.
      iv. La lesión. Fundamentos para negar valor a la lesión como vicio del
      consentimiento.
  - numero: 24
    seccion: II. Teoría del Acto Jurídico y el Contrato
    subseccion: ""
    tema: Error como vicio del consentimiento.
    contenido: |-
      i. Concepto de error.
      1. Error de Derecho.
      2. Error de Hecho. Error esencial/obstáculo. Error sustancial.
      Error en las calidades accidentales.
      3. Error en la persona.
      4. Error común.
      ii. Requisitos para que vicie consentimiento.
      iii. Sanciones aplicables a cada caso.
  - numero: 25
    seccion: II. Teoría del Acto Jurídico y el Contrato
    subseccion: ""
    tema: Dolo como vicio del consentimiento.
    contenido: |-
      i. Concepto de dolo.
      ii. Concepto de dolo como vicio del consentimiento.
      1. Requisitos del dolo como vicio del consentimiento. Concepto
      de dolo incidental.
      2. Sanción.
      iii. Manifestaciones de dolo en el Código Civil
  - numero: 26
    seccion: II. Teoría del Acto Jurídico y el Contrato
    subseccion: ""
    tema: Fuerza como vicio del consentimiento.
    contenido: |-
      i. Concepto de fuerza.
      ii. Clasificación.
      1. Fuerza física.
      2. Fuerza moral.
      iii. Requisitos de la fuerza como vicio del consentimiento.
      iv. Sanción a la fuerza como vicio del consentimiento.
  - numero: 27
    seccion: II. Teoría del Acto Jurídico y el Contrato
    subseccion: ""
    tema: Responsabilidad precontractual.
    contenido: |-
      i. Régimen aplicable.
      ii. Deberes precontractuales. Período que comprende.
      iii. Casos.
      1. Ruptura injustificada.
      2. Infracción u omisión a los deberes de información.
      iv. Sanción por infracción.
      1. Indemnización de perjuicios.
      2. Otras sanciones civiles.
      v. Fundamento responsabilidad precontractual
  - numero: 28
    seccion: II. Teoría del Acto Jurídico y el Contrato
    subseccion: ""
    tema: Teoría del objeto.
    contenido: |-
      i. Regulación del objeto en el Código Civil.
      ii. Diferenciar entre objeto del contrato, objeto de la obligación y objeto
