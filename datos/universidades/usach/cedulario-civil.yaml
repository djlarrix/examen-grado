      iii. Requisitos del objeto cosa.
      iv. Requisitos del objeto hecho.
      v. Sanción por falta de objeto.
  - numero: 29
    seccion: II. Teoría del Acto Jurídico y el Contrato
    subseccion: ""
    tema: Objeto ilícito.
    contenido: |-
      i. Falta de definición legal, discusión sobre su definición.
      ii. Casos regulados en la ley.
      iii. Sanciones.
  - numero: 30
    seccion: II. Teoría del Acto Jurídico y el Contrato
    subseccion: ""
    tema: Teoría de la Causa.
    contenido: |-
      i. Regulación en el Código Civil.
      1. Causal Real.
      2. Causa Licita.
      ii. Principales Doctrinas sobre la causa.
      1. Doctrina tradicional.
      2. Falta de causa.
      iii. Sanciones por causa ilícita
  - numero: 31
    seccion: II. Teoría del Acto Jurídico y el Contrato
    subseccion: ""
    tema: Simulación y Fraude a la ley.
    contenido: |-
      i. Concepto de simulación.
      1. Regulación en el Código Civil.
      2. Clasificación.
      3. Efectos.
      a. Entre las partes.
      b. Respecto de terceros.
      c. Acción de simulación.
      d. Sanciones de Ineficacia.
      ii. Concepto de fraude a la ley. Sanción.
  - numero: 32
    seccion: II. Teoría del Acto Jurídico y el Contrato
    subseccion: ""
    tema: Formalidades en el acto jurídico y el contrato.
    contenido: |-
      i. Requisitos externos.
      ii. Formalidades propiamente tales.
      1. Solemnidades de existencia.
      2. Solemnidades de validez.
      iii. Formalidades habilitantes.
      iv. Formalidades de prueba.
      v. Formalidades de publicidad.
  - numero: 33
    seccion: II. Teoría del Acto Jurídico y el Contrato
    subseccion: ""
    tema: Representación.
    contenido: |-
      i. Representación como acto jurídico.
      ii. Clases de representación.
      1. Convencional.
      2. Legal.
      3. Judicial.
      iii. Requisitos.
      iv. Teorías que explican su naturaleza.
      1. Ficción de la ley.
      2. Modalidad.
      v. Comparación con el mandato.
  - numero: 34
    seccion: II. Teoría del Acto Jurídico y el Contrato
    subseccion: ""
    tema: Manifestación de la renuncia Civil en el Código Civil.
    contenido: |-
      i. Regulación de la renuncia en el Código en el Civil.
      ii. Requisitos.
      1. Interés individual.
      2. No prohibida.
      iii. Principios.
      1. Normas de orden público.
      2. Normas de orden privado.
      iv. Casos de renuncia en el Código Civil.
      2. Sanciones de ineficacia.
  - numero: 35
    seccion: II. Teoría del Acto Jurídico y el Contrato
    subseccion: ""
    tema: Teoría de la inexistencia.
    contenido: |-
      i. Sanción de inexistencia.
      ii. Características.
      iii. Diferencias con nulidad.
      iv. Argumentos a favor y en contra de su procedencia.
  - numero: 36
    seccion: II. Teoría del Acto Jurídico y el Contrato
    subseccion: ""
    tema: Nulidad absoluta.
    contenido: |-
      i. Concepto de nulidad absoluta.
      ii. Regulación en el Código Civil.
      iii. Causales.
      iv. Legitimidad activa.
      v. Saneamiento.
      vi. Efectos declaración nulidad.
      1. Entre partes: prestaciones mutuas. Excepciones.
      2. Respecto terceros. Excepciones.
      vii. Diferencias con la nulidad relativa.
  - numero: 37
    seccion: II. Teoría del Acto Jurídico y el Contrato
    subseccion: ""
    tema: Nulidad relativa.
    contenido: |-
      i. Concepto de nulidad relativa.
      ii. Regulación en el Código Civil.
      iii. Causales.
      iv. Legitimidad activa.
      v. Saneamiento.
      vi. Efectos declaración nulidad.
      1. Entre partes: prestaciones mutuas. Excepciones.
      2. Respecto terceros. Excepciones.
      vii. Diferencias con la nulidad absoluta.
      3. Clasificación de los Actos Jurídicos y del contrato.
  - numero: 38
    seccion: II. Teoría del Acto Jurídico y el Contrato
    subseccion: ""
    tema: Clasificación de los actos jurídicos y los contratos.
    contenido: |-
      i. Clasificación de los actos jurídicos.
      1. Unilateral o bilateral.
      2. Entre vivos o por causa de muerte.
      3. A título gratuito u oneroso.
      4. Puro y simple o sujeto a modalidad.
      5. De familia o patrimoniales.
      6. Principal o accesorio.
      7. Solemnes o no solemnes.
      8. Nominado o innominado.
      ii. Clasificación de los contratos.
      1. Según el Código Civil.
      a. Unilateral o bilateral.
      b. Gratuito u oneroso.
      c. Conmutativo o aleatorio.
      d. Principal o accesorio.
      e. Consensual, real o solemne.
      2. Clasificación fuera del Código Civil.
      a. Nominado o innominado.
      b. Ejecución instantánea, ejecución diferida y de tracto
      sucesivo.
      c. Individual o colectivo.
      d. Libre o por adhesión.
  - numero: 39
    seccion: II. Teoría del Acto Jurídico y el Contrato
    subseccion: ""
    tema: Contratos Unilaterales y Bilaterales.
    contenido: |-
      i. Clasificación según quién resulta obligado. Momento en que se define.
      ii. Concepto de contrato unilateral.
      iii. Concepto de contrato bilateral.
      iv. Importancia de la distinción.
      1. Efectos asociados a los contratos bilaterales.
      a. Condición resolutoria tácita.
      b. Excepción de contrato no cumplido.
      c. Teoría de los riesgos.
      v. Concepto de contrato sinalagmático imperfecto. Discusión sobre si se
      les aplican los efectos propios de un contrato bilateral.
      vi. Noción de contrato plurilateral
  - numero: 40
    seccion: II. Teoría del Acto Jurídico y el Contrato
    subseccion: ""
    tema: Manifestación de la interdependencia de las obligaciones.
    contenido: |-
      i. Contrato bilateral.
      ii. Concepto de interdependencia de las obligaciones.
      iii. Excepción de contrato no cumplido.
      1. Procedencia.
      2. Requisitos.
      3. Efectos. Discusión sobre sus efectos.
      iv. Resolución por incumplimiento.
      1. Procedencia.
      2. Requisitos.
      3. Efectos. Discusión sobre sus efectos.
  - numero: 41
    seccion: II. Teoría del Acto Jurídico y el Contrato
    subseccion: ""
    tema: Teoría de los riesgos.
    contenido: |-
      i. Regulación en el Código Civil.
      1. Procedencia en relación a una obligación de dar una especie o
      cuerpo cierto.
      2. Requisitos.
      a. Cumplimiento de obligación pendiente.
      b. Causa inimputable al deudor.
      c. Imposibilidad de cumplir (irresistible).
      d. Imprevisibilidad al momento de celebrar el contrato.
      e. Concepto de caso fortuito.
      3. Excepciones a su aplicación.
      4. Efectos.
      a. Concepto de riesgo.
      b. Pérdida de la cosa que se debe como modo de extinguir
      las obligaciones.
      c. Distinción entre pérdida por caso fortuito y culpa.
      5. Cláusula modificatoria de riesgos.
      ii. Origen histórico.
      1. Críticas a la regulación nacional. Discusión sobre su aplicación
      en las obligaciones de hacer o no hacer.
  - numero: 42
    seccion: II. Teoría del Acto Jurídico y el Contrato
    subseccion: ""
    tema: Excepción de contrato no cumplido.
    contenido: |-
      i. Concepto de mora.
      ii. Incumplimiento de una obligación.
      iii. Regulación de la excepción de contrato no cumplido.
      1. Procedencia. Manifestación de la interdependencia de las
      obligaciones.
      2. Requisitos:
      a. Obligación actualmente exigible.
      b. Demandante no haya cumplido o no se encuentre llano
      a cumplir.
      3. Efectos. Discusión acerca de los efectos.
  - numero: 43
    seccion: II. Teoría del Acto Jurídico y el Contrato
    subseccion: ""
    tema: Contratos gratuitos y onerosos.
    contenido: |-
      i. Clasificación según la utilidad para las partes.
      ii. Contrato gratuito.
      iii. Contrato oneroso.
      1. Clasificación según la equivalencia de las prestaciones.
      a. Contrato conmutativo.
      b. Contrato aleatorio.
      c. Importancia de la clasificación: procedencia de la
      teoría de la imprevisión y la lesión enorme.
      d. Crítica a la clasificación.
      2. Crítica a la utilización del vocablo prestación en plural.
      3. Importancia de la clasificación en relación a otros conceptos
      jurídicos.
