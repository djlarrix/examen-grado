# Cedulario ciclo Derecho Civil — Examen de Licenciatura en Ciencias Jurídicas y Sociales, Facultad de Derecho USACH.
# https://derecho.usach.cl/wp-content/uploads/2023/10/Cedulario-Derecho-Civil.pdf
# Transcripción literal. Sigue la estructura del cedulario de la U. de Chile; cada cédula se reconoció por su título
# (scripts/importar-cedulario.mjs, formato "referencia") y hereda el enlace de su par de la U. de Chile.
ramo: civil
cedulas:
  - numero: 1
    seccion: I. Introducción al Derecho Civil
    subseccion: ""
    tema: Derecho Privado y sus fuentes. La Costumbre.
    contenido: |-
      i. Concepto de Derecho Privado.
      ii. Materias que comprende el Derecho Civil.
      iii. Características del Derecho Civil: Derecho común, general y
      supletorio.
      iv. Fuentes del Derecho Privado: Fuentes formales y materiales.
      v. La Costumbre en Derecho Privado: Concepto, Valor y Prueba de la
      costumbre en materia civil.
  - numero: 2
    seccion: I. Introducción al Derecho Civil
    subseccion: ""
    tema: Principios del Derecho Civil.
    contenido: |-
      i. Principios del Derecho Civil: Concepto.
      ii. Importancia de los Principios.
      iii. Enunciación.
      1) Autonomía de la voluntad.
      2) Buena fe.
      3) Responsabilidad.
      4) Prohibición del enriquecimiento injustificado.
      5) Abuso de derecho.
      6) Libre circulación de los bienes.
      7) Libertad.
      8) Igualdad.
      9) Defensa de la propiedad individual
  - numero: 3
    seccion: I. Introducción al Derecho Civil
    subseccion: ""
    tema: Principios de la Responsabilidad Civil.
    contenido: |-
      i. Concepto.
      ii. Discusión: estatuto único de responsabilidad.
      iii. Fundamento jurídico de la Responsabilidad.
      iv. Fuentes de los ilícitos civiles.
      1) Incumplimiento de la obligación contractual: responsabilidad
      contractual.
      2) Delito o cuasidelito civil: responsabilidad extracontractual.
      3) Cuasidelito e incumplimiento de obligaciones legales: régimen
      aplicable.
      v. Causales de exculpación.
      vi. Cúmulo opción o concurrencia de responsabilidades.
  - numero: 4
    seccion: I. Introducción al Derecho Civil
    subseccion: ""
    tema: Principio de la autonomía de la voluntad.
    contenido: |-
      i. Concepto.
      ii. Subprincipios que emanan de la autonomía de la voluntad.
      1) Consensualismo.
      2) Fuerza obligatoria de los contratos.
      3) Libertad contractual.
      4) Efecto relativo de los contratos.
      5) Efecto absoluto o expansivo de los contratos.
  - numero: 5
    seccion: I. Introducción al Derecho Civil
    subseccion: ""
    tema: Principio de la buena fe.
    contenido: |-
      i. Concepto de buena fe.
      ii. Buena fe objetiva.
      1) Regulación en el CC.
      2) Expresión durante el íter precontractual, contractual y pos
      contractual.
      iii. Buena fe subjetiva.
      1) Regulación en el CC.
      2) Presunción.
      3) Excepciones.
  - numero: 6
    seccion: I. Introducción al Derecho Civil
    subseccion: ""
    tema: Principio que prohíbe el enriquecimiento injustificado.
    contenido: |-
      i. Concepto de enriquecimiento injustificado.
      ii. Tratamiento de la materia en el ordenamiento jurídico e importancia
      de su regulación.
      iii. Manifestaciones en el Código Civil y los cuasicontratos.
  - numero: 7
    seccion: I. Introducción al Derecho Civil
    subseccion: ""
    tema: Principio de la libre circulación de los bienes.
    contenido: |-
      i. Conceptualización del principio.
      ii. Tratamiento de la materia en el ordenamiento jurídico e importancia
      de su regulación.
      iii. Excepciones o declinaciones en el ordenamiento jurídico.
  - numero: 8
    seccion: I. Introducción al Derecho Civil
    subseccion: ""
    tema: Principio de la Igualdad.
    contenido: |-
      i. Conceptualización del principio.
      ii. Tratamiento de la materia en el ordenamiento jurídico e importancia
