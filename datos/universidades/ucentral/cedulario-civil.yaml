ramo: civil
cedulas:
  - numero: 1
    seccion: Cedulario de Derecho Civil 2025
    subseccion: ""
    tema: Personas · Responsabilidad civil contractual
    contenido: |-
      1.- Personas. Concepto y clasificación. Atributos de la personalidad en las personas
      naturales. Paralelo con las personas jurídicas.
      2.- Responsabilidad civil contractual. Requisitos de procedencia. Mora y sus efectos.
      Formas de avaluación de los perjuicios.
  - numero: 2
    seccion: Cedulario de Derecho Civil 2025
    subseccion: ""
    tema: Sucesión por causa de muerte · Regímenes matrimoniales
    contenido: |-
      1.- Sucesión por causa de muerte. Concepto y naturaleza jurídica. Derecho real de herencia
      y formas de adquisición. Órdenes de sucesión intestada. Derechos que pueden concurrir en
      una sucesión.
      2.- Regímenes matrimoniales. Concepto y clasificaciones de los regímenes matrimoniales.
      Capitulaciones matrimoniales. Sociedad conyugal. Administración, haberes en la sociedad
      conyugal. Del pasivo de la sociedad conyugal. Recompensas.
  - numero: 3
    seccion: Cedulario de Derecho Civil 2025
    subseccion: ""
    tema: "Principios inspiradores del Código Civil: especial referencia a autonomía privada, buena · Filiación"
    contenido: |-
      1.- Principios inspiradores del Código Civil: especial referencia a autonomía privada, buena
      fe, enriquecimiento sin causa, libre circulación de los bienes, responsabilidad civil,
      omnipotencia de la ley, protección de la propiedad y seguridad jurídica.
      2.- Filiación. Clasificación. Acciones de filiación. Titulares de cada acción e hipótesis de
      procedencia. Efectos de la filiación.
  - numero: 4
    seccion: Cedulario de Derecho Civil 2025
    subseccion: ""
    tema: La posesión · Ineficacia de los actos jurídicos
    contenido: |-
      1.- La posesión. Concepto, elementos y clasificaciones de la posesión. La accesión de
      posesiones. Adquisición, conservación y pérdida de la posesión.
      2.- Ineficacia de los actos jurídicos. Concepto y clasificaciones. Inexistencia, Nulidad,
      renuncia, resolución, resciliación, terminación, inoponibilidad y plazo extintivo. Respecto
      de las mismas: concepto, causales, características y efectos.
  - numero: 5
    seccion: Cedulario de Derecho Civil 2025
    subseccion: ""
    tema: Acciones protectoras del dominio y la posesión · Vicios de la voluntad y simulación en los actos jurídicos
    contenido: |-
      1.- Acciones protectoras del dominio y la posesión. La acción reivindicatoria: concepto y
      requisitos, cosas que pueden reivindicarse y sujetos activo y pasivo de la acción
      reivindicatoria. La acción publiciana: concepto y requisitos de procedencia. Las
      prestaciones mutuas. Acciones posesorias: concepto y requisitos de procedencia. Tipos de
      acciones posesorias y su función específica.
      2.- Vicios de la voluntad y simulación en los actos jurídicos. El error, fuerza, dolo y lesión.
      Concepto, requisitos y efectos de cada uno.
  - numero: 6
    seccion: Cedulario de Derecho Civil 2025
    subseccion: ""
    tema: Modos de adquirir el dominio · Cuasicontratos
    contenido: |-
      1.- Modos de adquirir el dominio. Breve referencia a Ocupación y Accesión. Tradición:
      concepto, elementos y características. Naturaleza jurídica. Distinción entre entrega y
      tradición. Especies de tradición.
      2.- Cuasicontratos. Concepto y características como fuente de obligaciones civiles.
      Tratamiento en el Código Civil: agencia oficiosa o gestión de negocios ajenos, pago de lo
      no debido y la comunidad.
  - numero: 7
    seccion: Cedulario de Derecho Civil 2025
    subseccion: ""
    tema: La prescripción adquisitiva o usucapión · Garantía personales
    contenido: |-
      1.- La prescripción adquisitiva o usucapión. Concepto y regulación en el Código Civil.
      Reglas comunes a ambos tipos de prescripción. Requisitos generales de la prescripción
      adquisitiva. Clases de prescripción adquisitiva y sus requisitos. Interrupción y suspensión
      de la prescripción.
      2.- Garantía personales. Conceptos de garantía y caución. La fianza, la solidaridad pasiva y
      la cláusula penal.
  - numero: 8
    seccion: Cedulario de Derecho Civil 2025
    subseccion: ""
    tema: Sociedad conyugal · Efectos de las obligaciones en el incumplimiento
    contenido: |-
      1.- Sociedad conyugal. Administración de la sociedad conyugal y de los bienes de la mujer.
      Disolución de la sociedad conyugal. Renuncia a los gananciales. El patrimonio reservado de
      la mujer casada. Liquidación de la sociedad conyugal. El beneficio de emolumentos.
      2.- Efectos de las obligaciones en el incumplimiento. Ejecución forzada de obligaciones de
      dar, hacer y no hacer. Prelación de créditos: concepto y explicación de las causas de
      preferencia.
  - numero: 9
    seccion: Cedulario de Derecho Civil 2025
    subseccion: ""
    tema: Contratos · Teoría de los bienes
    contenido: |-
      1.- Contratos. Concepto, elementos o cosas de los contratos, y clasificaciones. Principios de
      la contratación. Efectos de los contratos. Reglas de interpretación de los contratos:
      enunciación, análisis y forma en que operan.
      2.- Teoría de los bienes. Concepto jurídico de cosa y bien. Derechos reales y personales.
      Concepto y clasificación de los derechos reales. Clasificación de las cosas en el Código
      Civil y su importancia.
  - numero: 10
    seccion: Cedulario de Derecho Civil 2025
    subseccion: ""
    tema: Derechos auxiliares del acreedor · Situaciones de ruptura del vínculo matrimonial
    contenido: |-
      1.- Derechos auxiliares del acreedor. Concepto y enumeración. Medidas conservativas.
      Acción pauliana o revocatoria y acción oblicua o subrogatoria.
      2.- Situaciones de ruptura del vínculo matrimonial. Divorcio. Nulidad (matrimonio
      putativo). Muerte. Separación judicial. Compensación económica.
  - numero: 11
    seccion: Cedulario de Derecho Civil 2025
    subseccion: ""
    tema: El matrimonio · Teoría de los bienes
    contenido: |-
      1.- El matrimonio. Definición legal de matrimonio. Requisitos de existencia y validez.
      Impedimentos dirimentes e impedientes o prohibiciones. Formalidades legales del
      matrimonio. Efectos del matrimonio.
      2.- Teoría de los bienes. Concepto jurídico de cosa y bien. Derechos reales y personales.
      Concepto y clasificación de los derechos reales. Clasificación de las cosas en el Código
