      1.- Modos de adquirir el dominio. Breve referencia a Ocupación y Accesión. Tradición:
      concepto, elementos y características. Naturaleza jurídica. Distinción entre entrega y
      tradición. Especies de tradición.
      2.- Derechos auxiliares del acreedor. Concepto y enumeración. Medidas conservativas.
      Acción pauliana o revocatoria y acción oblicua o subrogatoria.
  - numero: 37
    seccion: Cedulario de Derecho Civil 2025
    subseccion: ""
    tema: Regímenes matrimoniales · Sucesión testada
    contenido: |-
      1.- Regímenes matrimoniales. Concepto y clasificaciones de
      los regímenes matrimoniales. Capitulaciones matrimoniales.
      Sociedad conyugal. Administración, haberes en la sociedad
      conyugal. Del pasivo de la sociedad conyugal. Recompensas.
      2.- Sucesión testada. Concepto. El testamento: definición y características. Clases de
      testamento en la legislación chilena. Otorgados en Chile y en país extranjero. Concepto,
      requisitos y formalidades de cada uno de ellos. Revocación y reforma del testamento:
      acción de reforma del testamento. Naturaleza, concepto, características, objeto, legitimidad
      activa y pasiva. Preterición.
  - numero: 38
    seccion: Cedulario de Derecho Civil 2025
    subseccion: ""
    tema: Filiación · Teoría de los acervos
    contenido: |-
      1.- Filiación. Clasificación. Acciones de filiación. Titulares de cada acción e hipótesis de
      procedencia. Efectos de la filiación.
      2.- Teoría de los acervos. Bajas generales de la herencia. Acervos imaginarios. Medios
      directos e indirectos de protección de la legítima.
  - numero: 39
    seccion: Cedulario de Derecho Civil 2025
    subseccion: ""
    tema: Acciones protectoras del dominio y la posesión · Ineficacia de los actos jurídicos
    contenido: |-
      1.- Acciones protectoras del dominio y la posesión. La acción reivindicatoria: concepto y
      requisitos, cosas que pueden reivindicarse y sujetos activo y pasivo de la acción
      reivindicatoria. La acción publiciana: concepto y requisitos de procedencia. Las
      prestaciones mutuas. Acciones posesorias: concepto y requisitos de procedencia. Tipos de
      acciones posesorias y su función específica.
      2.- Ineficacia de los actos jurídicos. Concepto y clasificaciones. Inexistencia, Nulidad,
      renuncia, resolución, resciliación, terminación, inoponibilidad y plazo extintivo. Respecto
      de las mismas: concepto, causales, características y efectos.
