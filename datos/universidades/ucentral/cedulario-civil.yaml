    tema: Responsabilidad civil extracontractual · Personas
    contenido: |-
      1.- Responsabilidad civil extracontractual. Sistema de responsabilidad por daños en el
      Código Civil y sus elementos.
      2.- Personas. Concepto y clasificación. Atributos de la personalidad. Paralelo con las
      personas jurídicas.
