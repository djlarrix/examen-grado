  - numero: 12
    seccion: Cedulario de Derecho Civil 2025
    subseccion: ""
    tema: Obligaciones Modales · Responsabilidad civil extracontractual
    contenido: |-
      1.- Obligaciones Modales. Obligaciones a plazo: concepto y clasificación del plazo. Efectos.
